apiVersion: 1

policies:
  - orgId: 1
    receiver: discord-alerts
    group_by: ['alertname']
    # Wait a little before the first message so a blip that resolves itself in
    # under 30s never reaches the channel.
    group_wait: 30s
    group_interval: 5m
    # A still-firing alert is repeated every 4h rather than every few minutes:
    # an alert channel people mute is worse than no alert channel.
    repeat_interval: 4h
